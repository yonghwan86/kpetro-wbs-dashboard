<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3600">
    <meta name="kpetro-build" content="2026-08-26-tv-layout-v2">
    <title id="pageTitle">프로젝트 구축 현황</title>
    <meta name="robots" content="noindex,nofollow,noarchive">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/assets/kpetro-app-icon.png" type="image/png" sizes="512x512">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; min-height: 100%; overflow: hidden; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; background-color: #121212; color: #e0e0e0; }
        body {
            display: grid;
            grid-template-rows: 17vh 27vh minmax(0, 1fr) auto;
            grid-template-rows: clamp(120px, 17vh, 190px) clamp(170px, 27vh, 305px) minmax(0, 1fr) auto;
            padding: 1.2vh 1.2vw;
            gap: 1vh;
        }

        .d-day-section { min-height: 0; height: 100%; background-color: #000000; padding: 1.2vh 20px; border-radius: 12px; display: grid; grid-template-columns: minmax(285px, 0.8fr) minmax(520px, 2fr) minmax(285px, 0.8fr); align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.8); border: 1px solid #222; position: relative; overflow: hidden; }
        .brand-area { display: flex; justify-content: flex-start; align-items: center; min-width: 0; padding-left: 10px; }
        .brand-lockup { width: 275px; height: 78px; display: flex; align-items: center; justify-content: flex-start; }
        .brand-logo { display: block; width: 100%; height: 100%; object-fit: contain; object-position: left center; image-rendering: auto; }
        .header-balance { min-width: 0; }

        .d-day-center { text-align: center; min-width: 0; }
        .d-day-title { color: #cccccc; font-size: 24px; font-size: clamp(18px, 2vw, 28px); font-weight: 400; margin-bottom: 1vh; letter-spacing: 3px; }
        .d-day-timer { display: flex; justify-content: center; align-items: flex-start; gap: 1.5vw; }
        .time-box { display: flex; flex-direction: column; align-items: center; width: auto; min-width: 60px; }
        .time-value { color: #ffffff; font-size: 48px; font-size: clamp(30px, 4vw, 65px); font-weight: bold; font-family: 'Arial', sans-serif; text-shadow: 0px 0px 15px rgba(255, 255, 255, 0.9); line-height: 1; }
        .time-label { color: #999999; font-size: 14px; font-size: clamp(12px, 1.2vw, 18px); margin-top: 0.5vh; font-weight: bold; }
        .time-colon { color: #444444; font-size: 38px; font-size: clamp(20px, 3.5vw, 50px); font-weight: bold; margin-top: -3px; line-height: 1.2; }

        .top-section { min-height: 0; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 1.5vw; overflow: hidden; }
        .sys-chart-wrapper, .chart-wrapper { border: 1px solid #333; background: #1a1a1a; border-radius: 8px; min-width: 0; min-height: 0; height: 100%; position: relative; overflow: hidden; contain: layout paint; }
        .sys-chart-wrapper canvas, .chart-wrapper canvas {
            position: absolute;
            top: 8px;
            right: 8px;
            bottom: 8px;
            left: 8px;
            display: block;
            width: calc(100% - 16px) !important;
            height: calc(100% - 16px) !important;
            max-width: calc(100% - 16px) !important;
            max-height: calc(100% - 16px) !important;
        }

        .table-wrapper { min-height: 0; height: 100%; background: #1a1a1a; border-radius: 8px; padding: 1vh; border: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; position: relative; isolation: isolate; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 12px; font-size: clamp(11px, 0.9vw, 13px); color: #ccc; table-layout: fixed; }
        th, td { border: 1px solid #444; padding: 0.4vh 0.4vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .table-header-box { flex: 0 0 auto; width: 100%; background-color: #262626; overflow: hidden; }
        .table-header-box th { font-weight: bold; color: #ddd; }
        .table-body-box { flex: 1 1 auto; width: 100%; overflow-y: auto; overflow-x: auto; min-height: 0; }
        .table-body-box td { background-color: #1a1a1a; }

        .month-header { background-color: #383018 !important; color: #e6c86e !important; }
        .week-header { background-color: #1f2a38 !important; color: #8faecf !important; }
        .gate-header { background-color: #990000 !important; color: #ffffff !important; font-weight: bold; }

        .timeline-cell { border: 1px dashed #555; }
        .gantt-fill { background-color: #ca8a04 !important; }
        .current-week-line { border-left: 2px solid #5b9bd5 !important; border-right: 2px solid #5b9bd5 !important; }
        th.current-week-line { background-color: #4a6fa5 !important; color: #ffffff !important; border: 1px solid #5b9bd5 !important; text-shadow: 0 0 5px rgba(255,255,255,0.8); }

        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; border: 1px solid #111; }
        .dot-green { background-color: #70a33a; }
        .dot-yellow { background-color: #cc9900; }
        .dot-red { background-color: #cc0000; }
        .dot-red.is-editable { width: 14px; height: 14px; cursor: pointer; transition: transform .2s, box-shadow .2s; }
        .dot-red.is-editable:hover { transform: scale(1.2); box-shadow: 0 0 9px rgba(255,77,77,.9); }

        .bottom-nav { min-height: 0; display: flex; justify-content: center; gap: 9px; padding-top: 3px; flex-wrap: nowrap; overflow: hidden; }
        .nav-btn { background-color: #2b4f73; color: #fff; border: 1px solid #5b9bd5; padding: 8px 20px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; text-decoration: none; transition: background 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .nav-btn:hover { background-color: #3b6fa5; }
        body.tv-display { grid-template-rows: clamp(120px, 17vh, 190px) clamp(170px, 27vh, 305px) minmax(0, 1fr); }
        body.tv-display .bottom-nav { display: none; }
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.78); z-index:1000; justify-content:center; align-items:center; }
        .modal-box { width:min(520px,92vw); background:#1a1a1a; border:1px solid #444; border-radius:10px; padding:24px; box-shadow:0 8px 28px rgba(0,0,0,.8); }
        .modal-box h3 { margin-bottom:16px; color:#ff7777; font-size:18px; }
        .modal-group { margin-bottom:14px; }
        .modal-group label { display:block; margin-bottom:5px; color:#bbb; font-size:13px; font-weight:bold; }
        .modal-group textarea { width:100%; min-height:90px; padding:10px; color:#fff; background:#252525; border:1px solid #555; border-radius:6px; resize:vertical; }
        .modal-actions { display:flex; justify-content:flex-end; gap:8px; }
        .modal-actions button { padding:8px 16px; border:0; border-radius:5px; color:#fff; cursor:pointer; }

        @media screen and (max-width: 1400px) {
            .d-day-section { grid-template-columns: minmax(225px, 0.75fr) minmax(500px, 2fr) minmax(225px, 0.75fr); }
            .brand-lockup { width: 220px; height: 63px; }
        }

        @media screen and (max-width: 1050px) {
            .d-day-section { grid-template-columns: 180px minmax(470px, 1fr) 36px; padding-left: 14px; padding-right: 14px; }
            .brand-area { padding-left: 4px; }
            .brand-lockup { width: 175px; height: 50px; }
            .d-day-title { letter-spacing: 1px; }
        }

        /* 스마트 TV 브라우저의 확대 배율과 낮은 CSS 뷰포트에 맞춘 고정 화면 모드 */
        @media screen and (max-height: 800px), screen and (max-width: 1400px) {
            body {
                grid-template-rows: 17vh 27vh minmax(0, 1fr) auto;
                grid-template-rows: clamp(105px, 17vh, 145px) clamp(155px, 27vh, 225px) minmax(0, 1fr) auto;
                padding: 1vh 1vw;
                gap: 0.8vh;
            }
            .d-day-section { padding-top: 0.8vh; padding-bottom: 0.8vh; }
            .d-day-title { margin-bottom: 0.6vh; font-size: clamp(17px, 1.8vw, 24px); }
            .time-value { font-size: clamp(28px, 3.8vw, 54px); }
            .time-label { font-size: clamp(11px, 1.1vw, 15px); }
            .table-wrapper { padding: 0.7vh; }
            .nav-btn { padding: 6px 14px; font-size: 12px; }
            body.tv-display { grid-template-rows: clamp(105px, 17vh, 145px) clamp(155px, 27vh, 225px) minmax(0, 1fr); }
        }

        /* --- A4 한 페이지 인쇄 최적화 스타일 --- */
        @media print {
            @page {
                size: A4 landscape;
                margin: 5mm;
            }
            html, body {
                width: 100% !important;
                height: 100% !important;
                overflow: hidden !important;
                background-color: #121212 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                zoom: 88%;
            }
            body {
                display: flex !important;
                flex-direction: column !important;
                padding: 0 !important;
                gap: 5px !important;
            }
            .bottom-nav {
                display: none !important;
            }
            .table-wrapper {
                max-height: none !important;
                overflow: visible !important;
            }
            .table-body-box {
                max-height: none !important;
                overflow: visible !important;
            }
        }
    </style>
</head>
<body>

    <div class="d-day-section">
        <div class="brand-area">
            <div class="brand-lockup">
                <img src="/api/branding/logo" alt="KPetro 코퍼레이트 심볼" class="brand-logo" onerror="this.src='/assets/kpetro-ci.png'">
            </div>
        </div>
        <div class="d-day-center">
            <div class="d-day-title" id="dDayTitle">프로젝트 구축 D-DAY</div>
            <div class="d-day-timer">
                <div class="time-box"><div class="time-value" id="days">00</div><div class="time-label">일</div></div>
                <div class="time-colon">:</div>
                <div class="time-box"><div class="time-value" id="hours">00</div><div class="time-label">시</div></div>
                <div class="time-colon">:</div>
                <div class="time-box"><div class="time-value" id="minutes">00</div><div class="time-label">분</div></div>
                <div class="time-colon">:</div>
                <div class="time-box"><div class="time-value" id="seconds">00</div><div class="time-label">초</div></div>
            </div>
        </div>
        <div class="header-balance" aria-hidden="true"></div>
    </div>

    <div class="top-section">
        <div class="sys-chart-wrapper"><canvas id="sysComparisonChart"></canvas></div>
        <div class="chart-wrapper"><canvas id="progressChart"></canvas></div>
    </div>

    <div class="table-wrapper">
        <div class="table-header-box" id="headerBox">
            <table id="headerTable">
                <colgroup id="sharedColGroup"></colgroup>
                <thead>
                    <tr id="headerMonthRow">
                        <th rowspan="2">시스템명</th>
                        <th rowspan="2">단계</th>
                        <th rowspan="2">계획진척율</th>
                        <th rowspan="2">실제진척율</th>
                        <th rowspan="2">
                            차이<br>
                            <div style="display: inline-flex; gap: 3px; margin-top: 3px;" class="no-print">
                                <button id="btnAll" onclick="setFilter('all')" style="font-size:10px; padding:1px 5px; background:#2b4f73; color:#fff; border:1px solid #5b9bd5; border-radius:3px; cursor:pointer; font-weight:bold;">전체</button>
                                <button id="btnDelayed" onclick="setFilter('delayed')" style="font-size:10px; padding:1px 5px; background:#444; color:#aaa; border:1px solid #555; border-radius:3px; cursor:pointer; font-weight:bold;">지연</button>
                            </div>
                        </th>
                    </tr>
                    <tr id="headerWeekRow"></tr>
                </thead>
            </table>
        </div>
        <div class="table-body-box" id="bodyBox">
            <table id="bodyTable">
                <colgroup id="bodyColGroup"></colgroup>
                <tbody id="wbsTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="delayModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="delayModalTitle">
        <div class="modal-box">
            <h3 id="delayModalTitle">지연 사유 및 만회 계획</h3>
            <div class="modal-group">
                <label for="delayReason">지연 사유</label>
                <textarea id="delayReason" maxlength="4000" placeholder="지연 원인과 현재 상황을 입력하세요."></textarea>
            </div>
            <div class="modal-group">
                <label for="recoveryPlan">만회 계획</label>
                <textarea id="recoveryPlan" maxlength="4000" placeholder="일정 만회를 위한 조치와 목표일을 입력하세요."></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" id="delayCancel" style="background:#555;">취소</button>
                <button type="button" id="delaySave" style="background:#2e7d32;">저장</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="/input.html" class="nav-btn">진척관리(단계별)</a>
        <a href="/weekly-input.html" class="nav-btn">진척관리(주차별)</a>
        <a href="/meetings.html" class="nav-btn" style="background-color: #3b5998;">회의 관리</a>
        <a href="/project-config.html" class="nav-btn" style="background-color: #4a3380;">프로젝트 관리</a>
        <a href="/users.html" class="nav-btn" style="background-color: #6a1b9a;">회원 관리</a>
        <a href="/codes.html" class="nav-btn" style="background-color: #006064;">코드 관리</a>
        <button class="nav-btn" onclick="window.print()">출력</button>
        <a href="/login.html" class="nav-btn" style="background-color:#555;">로그인 화면</a>
    </div>

    <script>
        let currentFilter = 'all';
        let editingDelayItem = null;

        // 맨 앞의 숫자와 점(예: "1. ", "2. ")을 숨기기 위한 헬퍼 함수
        function cleanDisplayLabel(text) {
            if (!text) return '';
            return text.replace(/^\d+[\.\s\-]+\s*/, '');
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }

        function setFilter(mode) {
            currentFilter = mode;
            if (mode === 'all') {
                document.getElementById('btnAll').style.background = '#2b4f73';
                document.getElementById('btnAll').style.color = '#fff';
                document.getElementById('btnAll').style.borderColor = '#5b9bd5';
                document.getElementById('btnDelayed').style.background = '#444';
                document.getElementById('btnDelayed').style.color = '#aaa';
                document.getElementById('btnDelayed').style.borderColor = '#555';
            } else {
                document.getElementById('btnDelayed').style.background = '#990000';
                document.getElementById('btnDelayed').style.color = '#fff';
                document.getElementById('btnDelayed').style.borderColor = '#ff4d4d';
                document.getElementById('btnAll').style.background = '#444';
                document.getElementById('btnAll').style.color = '#aaa';
                document.getElementById('btnAll').style.borderColor = '#555';
            }
            window.updateDashboard();
        }

        function openDelayModal(systemName, phaseName, item) {
            editingDelayItem = { systemName, phaseName };
            document.getElementById('delayModalTitle').textContent = `${cleanDisplayLabel(systemName)} > ${cleanDisplayLabel(phaseName)} 지연 관리`;
            document.getElementById('delayReason').value = item.delay_reason || '';
            document.getElementById('recoveryPlan').value = item.recovery_plan || '';
            document.getElementById('delayModal').style.display = 'flex';
        }

        function closeDelayModal() {
            editingDelayItem = null;
            document.getElementById('delayModal').style.display = 'none';
        }

        async function saveDelayData() {
            if (!editingDelayItem) return;
            const response = await fetch('/api/wbs/delay', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_name: editingDelayItem.systemName,
                    phase_name: editingDelayItem.phaseName,
                    delay_reason: document.getElementById('delayReason').value,
                    recovery_plan: document.getElementById('recoveryPlan').value
                })
            });
            const result = await response.json();
            if (!response.ok || !result.success) { alert(result.message || '저장하지 못했습니다.'); return; }
            closeDelayModal();
            window.updateDashboard();
        }

        document.addEventListener("DOMContentLoaded", function() {
            Chart.register(ChartDataLabels);

            let projectStartDate = new Date('2026-08-01T00:00:00');
            let projectEndDate = new Date('2026-12-31T00:00:00');
            let weekMapping = [];
            let monthGroups = [];
            let currentGlobalWeek = 1;
            let gateWeek = 0;

            function calculateTimeline() {
                const inclusiveDays = Math.max(1, Math.floor((projectEndDate - projectStartDate) / 86400000) + 1);
                const totalWeeks = Math.max(1, Math.ceil(inclusiveDays / 7));
                const monthCounts = new Map();
                weekMapping = [];
                for (let index = 0; index < totalWeeks; index++) {
                    const weekDate = new Date(projectStartDate);
                    weekDate.setDate(weekDate.getDate() + index * 7);
                    const monthKey = `${weekDate.getFullYear()}-${weekDate.getMonth()}`;
                    const monthWeek = (monthCounts.get(monthKey) || 0) + 1;
                    monthCounts.set(monthKey, monthWeek);
                    weekMapping.push({ globalW: index + 1, monthW: monthWeek, month: weekDate.getMonth() + 1, monthKey });
                }
                monthGroups = [];
                weekMapping.forEach(item => {
                    const last = monthGroups[monthGroups.length - 1];
                    if (last && last.key === item.monthKey) last.count += 1;
                    else monthGroups.push({ key: item.monthKey, month: item.month, count: 1 });
                });
            }

            function buildMonthHeader() {
                const row = document.getElementById('headerMonthRow');
                row.querySelectorAll('[data-timeline-month]').forEach(cell => cell.remove());
                monthGroups.forEach(group => {
                    const th = document.createElement('th');
                    th.colSpan = group.count;
                    th.className = 'month-header';
                    th.dataset.timelineMonth = group.key;
                    th.textContent = `${group.month}월`;
                    row.appendChild(th);
                });
            }

            function buildColGroups() {
                const widths = ['15%', '16%', '7%', '7%', '7%'];
                for (let i = 0; i < weekMapping.length; i++) { widths.push('1.8vw'); }
                const makeCols = (groupId) => {
                    const cg = document.getElementById(groupId);
                    cg.innerHTML = '';
                    widths.forEach(w => {
                        let col = document.createElement('col');
                        col.style.width = w;
                        cg.appendChild(col);
                    });
                };
                makeCols('sharedColGroup');
                makeCols('bodyColGroup');
            }
            calculateTimeline();
            buildColGroups();
            buildMonthHeader();

            const headerWeekRow = document.getElementById('headerWeekRow');
            function buildWeekHeader() {
                headerWeekRow.innerHTML = '';
                weekMapping.forEach(item => {
                    let th = document.createElement('th');
                    if (item.globalW === gateWeek) {
                        th.className = 'timeline-cell gate-header';
                        th.textContent = item.monthW;
                    } else {
                        let cls = 'week-header timeline-cell';
                        if (item.globalW === currentGlobalWeek) cls += ' current-week-line';
                        th.className = cls;
                        th.textContent = item.monthW;
                    }
                    headerWeekRow.appendChild(th);
                });
            }
            buildWeekHeader();
            document.getElementById('delayCancel').addEventListener('click', closeDelayModal);
            document.getElementById('delaySave').addEventListener('click', saveDelayData);
            document.getElementById('delayModal').addEventListener('click', event => {
                if (event.target.id === 'delayModal') closeDelayModal();
            });

            const bodyBox = document.getElementById('bodyBox');
            const headerBox = document.getElementById('headerBox');

            function syncScrollbarWidth() {
                const scrollbarWidth = bodyBox.offsetWidth - bodyBox.clientWidth;
                headerBox.style.paddingRight = scrollbarWidth > 0 ? scrollbarWidth + 'px' : '0px';
            }
            window.addEventListener('load', syncScrollbarWidth);
            window.addEventListener('resize', syncScrollbarWidth);
            bodyBox.addEventListener('scroll', () => { headerBox.scrollLeft = bodyBox.scrollLeft; });

            function getDateWeek(dateStr) {
                if (!dateStr) return 0;
                const d = new Date(dateStr);
                const diffDays = Math.floor((d - projectStartDate) / (1000 * 60 * 60 * 24));
                return Math.max(1, Math.min(weekMapping.length, Math.floor(diffDays / 7) + 1));
            }

            let targetTimestamp = new Date('2026-11-01T00:00:00').getTime();
            async function initProjectConfig() {
                try {
                    const res = await fetch('/api/config', { cache: 'no-store' });
                    const config = await res.json();
                    if (config.project_title) {
                        document.getElementById('dDayTitle').innerText = config.project_title + ' D-DAY';
                        document.getElementById('pageTitle').innerText = config.project_title + ' 현황';
                    }
                    if (config.target_date) {
                        targetTimestamp = new Date(config.target_date + 'T00:00:00').getTime();
                    }
                    if (config.start_date) projectStartDate = new Date(config.start_date + 'T00:00:00');
                    if (config.end_date) projectEndDate = new Date(config.end_date + 'T00:00:00');
                    calculateTimeline();
                    gateWeek = config.target_date ? getDateWeek(config.target_date) : 0;
                    const elapsedWeeks = Math.floor((new Date() - projectStartDate) / (7 * 24 * 60 * 60 * 1000));
                    currentGlobalWeek = Math.max(1, Math.min(weekMapping.length, elapsedWeeks + 1));
                    buildColGroups();
                    buildMonthHeader();
                    buildWeekHeader();
                } catch(e) { console.error(e); }
            }

            function updateTimer() {
                const now = new Date().getTime();
                const distance = targetTimestamp - now;
                if (distance > 0) {
                    document.getElementById("days").innerText = String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2, '0');
                    document.getElementById("hours").innerText = String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
                    document.getElementById("minutes").innerText = String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
                    document.getElementById("seconds").innerText = String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0');
                }
            }
            setInterval(updateTimer, 1000);

            const dataLabelConfig = {
                color: '#fff', anchor: 'end', align: 'top',
                font: { weight: 'bold', size: 11 },
                formatter: v => Math.round(v) + '%'
            };

            const sysChartCtx = document.getElementById('sysComparisonChart').getContext('2d');
            const sysComparisonChart = new Chart(sysChartCtx, {
                type: 'bar',
                data: { labels: [], datasets: [
                    { label: '계획', data: [], backgroundColor: '#5b9bd5', datalabels: dataLabelConfig },
                    { label: '실적', data: [], backgroundColor: '#ed7d31', datalabels: dataLabelConfig }
                ]},
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false, devicePixelRatio: 1, resizeDelay: 150,
                    layout: { padding: { top: 20 } },
                    scales: {
                        y: { min: 0, max: 100, ticks: { color: '#ccc', callback: v => v + '%' }, grid: { color: '#333' } },
                        x: {
                            ticks: {
                                color: '#ccc',
                                callback: function(val, index) {
                                    // 그래프 하단 축 라벨에서도 번호 제거
                                    return cleanDisplayLabel(this.getLabelForValue(val));
                                }
                            },
                            grid: { color: '#333' }
                        }
                    },
                    plugins: { legend: { labels: { color: '#fff', boxWidth: 12 } } }
                }
            });

            const chartCtx = document.getElementById('progressChart').getContext('2d');
            const progressChart = new Chart(chartCtx, {
                type: 'line',
                data: { labels: [], datasets: [
                    {
                        label: '계획', data: [], borderColor: '#5b9bd5', tension: 0.1,
                        pointRadius: ctx => ctx.dataIndex === (currentGlobalWeek - 1) ? 7 : 3,
                        pointBackgroundColor: ctx => ctx.dataIndex === (currentGlobalWeek - 1) ? '#ffffff' : '#5b9bd5',
                        pointBorderColor: '#5b9bd5', pointBorderWidth: ctx => ctx.dataIndex === (currentGlobalWeek - 1) ? 3 : 1,
                        datalabels: { color: '#5b9bd5', align: 'top', font: { size: 10, weight: 'bold' }, formatter: v => (v ? v + '%' : '') }
                    },
                    {
                        label: '실적', data: [], borderColor: '#ed7d31', tension: 0.1,
                        pointRadius: ctx => ctx.dataIndex === (currentGlobalWeek - 1) ? 7 : 3,
                        pointBackgroundColor: ctx => ctx.dataIndex === (currentGlobalWeek - 1) ? '#ffffff' : '#ed7d31',
                        pointBorderColor: '#ed7d31', pointBorderWidth: ctx => ctx.dataIndex === (currentGlobalWeek - 1) ? 3 : 1,
                        datalabels: { color: '#ed7d31', align: 'bottom', font: { size: 10, weight: 'bold' }, formatter: v => (v ? v + '%' : '') }
                    }
                ]},
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false, devicePixelRatio: 1, resizeDelay: 150,
                    layout: { padding: { top: 15, bottom: 15 } },
                    scales: {
                        y: { min: 0, max: 100, ticks: { color: '#ccc', callback: v => v + '%' }, grid: { color: '#333' } },
                        x: { ticks: { color: '#ccc' }, grid: { color: '#333' } }
                    },
                    plugins: { legend: { labels: { color: '#fff', boxWidth: 12 } } }
                }
            });

            window.updateDashboard = async function() {
                try {
                    const [resWeekly, resWbs] = await Promise.all([
                        fetch('/api/weekly', { cache: 'no-store' }),
                        fetch('/api/wbs', { cache: 'no-store' })
                    ]);
                    const weekly = await resWeekly.json();
                    const state = await resWbs.json();

                    if (weekly && weekly.labels) {
                        progressChart.data.labels = weekly.labels;
                        progressChart.data.datasets[0].data = weekly.plan;
                        progressChart.data.datasets[1].data = weekly.actual;
                        progressChart.update();
                    }

                    if (!state) return;

                    const systemsMap = {};
                    for (const key in state) {
                        const idx = key.indexOf('_');
                        if (idx === -1) continue;
                        const sys = key.substring(0, idx);
                        const phase = key.substring(idx + 1);
                        if (!systemsMap[sys]) systemsMap[sys] = [];
                        systemsMap[sys].push(Object.assign({ phase: phase }, state[key]));
                    }

                    const tbody = document.getElementById('wbsTableBody');
                    tbody.innerHTML = '';
                    let chartLabels = [], chartPlan = [], chartActual = [];

                    for (const sys in systemsMap) {
                        const allPhases = systemsMap[sys];

                        const phases = allPhases.filter(item => {
                            const p = parseFloat(item.plan) || 0;
                            const a = parseFloat(item.actual) || 0;
                            const diff = a - p;
                            if (currentFilter === 'delayed') {
                                return diff < 0;
                            }
                            return true;
                        });

                        let sysPlanSum = 0, sysActualSum = 0;
                        allPhases.forEach(item => {
                            const w = parseFloat(item.weight) || 0;
                            const p = parseFloat(item.plan) || 0;
                            const a = parseFloat(item.actual) || 0;
                            sysPlanSum += (p * w) / 100;
                            sysActualSum += (a * w) / 100;
                        });

                        chartLabels.push(sys); // 정렬 및 매핑용 원본 이름 유지
                        chartPlan.push(Math.round(sysPlanSum));
                        chartActual.push(Math.round(sysActualSum));

                        if (phases.length === 0) continue;

                        phases.forEach((item, index) => {
                            const p = parseFloat(item.plan) || 0;
                            const a = parseFloat(item.actual) || 0;
                            const diff = (a - p).toFixed(1);
                            let dotClass = 'dot-green';
                            if (diff < 0) dotClass = diff <= -1.0 ? 'dot-red' : 'dot-yellow';
                            const editableClass = dotClass === 'dot-red' ? ' is-editable' : '';

                            const startWeek = getDateWeek(item.start_date);
                            const endWeek = getDateWeek(item.end_date);

                            let tr = document.createElement('tr');
                            if (index === 0) {
                                // 화면 표시 시 번호 제거된 이름(cleanDisplayLabel) 사용
                                tr.innerHTML += `<td rowspan="${phases.length}" style="font-weight:bold; color: #fff; background-color: #1a1a1a;">${escapeHtml(cleanDisplayLabel(sys))}</td>`;
                            }
                            tr.innerHTML += `
                                <td style="background-color: #1a1a1a;">${escapeHtml(cleanDisplayLabel(item.phase))}</td>
                                <td style="background-color: #1a1a1a;">${p}%</td>
                                <td style="background-color: #1a1a1a;">${a}%</td>
                                <td style="background-color: #1a1a1a;"><span class="dot ${dotClass}${editableClass}"></span> ${diff > 0 ? '+' + diff : diff}%</td>
                            `;
                            weekMapping.forEach(wItem => {
                                let classes = ['timeline-cell'];
                                if (item.start_date && item.end_date && wItem.globalW >= startWeek && wItem.globalW <= endWeek) {
                                    classes.push('gantt-fill');
                                }
                                if (wItem.globalW === currentGlobalWeek) classes.push('current-week-line');
                                tr.innerHTML += `<td class="${classes.join(' ')}" style="background-color: #1a1a1a;"></td>`;
                            });
                            if (dotClass === 'dot-red') {
                                const statusDot = tr.querySelector('.dot-red');
                                statusDot.title = '지연 사유 및 만회 계획 입력';
                                statusDot.setAttribute('role', 'button');
                                statusDot.tabIndex = 0;
                                const openEditor = () => openDelayModal(sys, item.phase, item);
                                statusDot.addEventListener('click', openEditor);
                                statusDot.addEventListener('keydown', event => {
                                    if (event.key === 'Enter' || event.key === ' ') openEditor();
                                });
                            }
                            tbody.appendChild(tr);
                        });
                    }

                    sysComparisonChart.data.labels = chartLabels;
                    sysComparisonChart.data.datasets[0].data = chartPlan;
                    sysComparisonChart.data.datasets[1].data = chartActual;
                    sysComparisonChart.update();

                    syncScrollbarWidth();
                } catch(e) { console.error(e); }
            }

            initProjectConfig().then(() => {
                updateTimer();
                updateDashboard();
            });
            setInterval(updateDashboard, 60 * 60 * 1000);
        });
    </script>
</body>
</html>
