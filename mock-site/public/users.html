<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive"><title>회원 관리</title>
    <link rel="icon" href="/assets/kpetro-app-icon.png" type="image/png"><script src="/assets/secure-page.js"></script>
    <style>
        *{box-sizing:border-box}body{margin:0;padding:20px;background:#121212;color:#e5e5e5;font-family:'Malgun Gothic',sans-serif}.container{max-width:1450px;margin:auto}.head,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.head{margin-bottom:16px}.toolbar{padding:12px;margin-bottom:14px;background:#1d1d1d;border:1px solid #333;border-radius:8px}h1{margin:0;font-size:23px}.tag{color:#e4cd79;font-size:12px}
        button,.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 13px;border:1px solid #5b9bd5;border-radius:6px;background:#2b4f73;color:#fff;font-weight:bold;text-decoration:none;cursor:pointer}.secondary{background:#444;border-color:#666}.success{background:#2e7d32;border-color:#4caf50}.danger{background:#8b1111;border-color:#d64a4a}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(330px,.7fr);gap:14px}.panel{background:#1a1a1a;border:1px solid #333;border-radius:9px;padding:16px;min-width:0}.table-wrap{overflow:auto;max-height:68vh}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border:1px solid #444;white-space:nowrap;text-align:center}th{position:sticky;top:0;background:#282828;color:#ddd}.admin{color:#e4cd79}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;margin-bottom:4px;color:#aaa;font-size:11px;font-weight:bold}input,select{width:100%;padding:8px;background:#272727;color:#fff;border:1px solid #555;border-radius:5px}.permissions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.perm{display:flex;align-items:center;justify-content:space-between;padding:7px;background:#242424;border-radius:5px;font-size:12px}.perm input{width:auto}.actions{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}.excel{display:flex;align-items:center;gap:8px;font-size:12px}.excel input{width:auto}.hint{margin-top:10px;color:#999;font-size:11px;line-height:1.5}@media(max-width:1050px){.grid{grid-template-columns:1fr}.table-wrap{max-height:45vh}}
    </style>
</head>
<body>
<main class="container">
    <div class="head"><div><h1>회원 관리</h1><div class="tag">계정과 화면별 접근권한을 관리합니다.</div></div><div><a class="btn secondary" href="/codes.html">공통 코드</a> <a class="btn" href="/">대시보드</a></div></div>
    <div class="toolbar"><button id="newButton">+ 신규 회원</button><div class="excel"><span>회원 엑셀 등록:</span><input id="excelFile" type="file" accept=".xlsx"><button class="success" id="excelButton">엑셀 반영</button></div></div>
    <div class="grid">
        <section class="panel table-wrap"><table><thead><tr><th>아이디</th><th>성명</th><th>소속</th><th>팀명</th><th>직무</th><th>이메일</th><th>기간</th><th>권한</th><th>관리</th></tr></thead><tbody id="userRows"></tbody></table></section>
        <section class="panel"><h2 id="formTitle" style="font-size:17px;margin:0 0 14px">신규 회원 등록</h2>
            <div class="form-grid">
                <div><label for="userId">아이디</label><input id="userId" maxlength="50" placeholder="3~50자"></div><div><label for="userName">성명</label><input id="userName"></div>
                <div><label for="affiliation">소속</label><input id="affiliation"></div><div><label for="teamName">팀명</label><select id="teamName"></select></div>
                <div><label for="jobRole">직무</label><select id="jobRole"></select></div><div><label for="phone">휴대폰</label><input id="phone"></div>
                <div class="full"><label for="email">이메일</label><input id="email" type="email"></div>
                <div><label for="startDate">개시일</label><input id="startDate" type="date"></div><div><label for="endDate">종료일</label><input id="endDate" type="date"></div>
                <div class="full"><label>화면 접근권한</label><div class="permissions" id="permissions"></div></div>
            </div>
            <div class="actions"><button class="secondary" id="cancelButton">초기화</button><button class="success" id="saveButton">저장</button></div>
            <div class="hint">신규 회원의 임시 비밀번호는 생성 직후 한 번만 표시됩니다. 전달 후 사용자가 최초 로그인에서 변경해야 합니다.</div>
        </section>
    </div>
</main>
<script>
    const permissionNames=['대시보드','단계별진척','주차별진척','회의관리','프로젝트관리','회원관리','코드관리'];
    let editingId='';
    function makeCell(row,value,className){const cell=document.createElement('td');cell.textContent=value??'';if(className)cell.className=className;row.appendChild(cell);return cell;}
    function permissionText(raw){if(raw==='all')return '전체';try{return Object.entries(JSON.parse(raw||'{}')).filter(([,v])=>v==='Y').map(([k])=>k).join(', ');}catch{return raw||'';}}
    function renderPermissions(selected){const box=document.getElementById('permissions');box.innerHTML='';let parsed={};if(selected==='all')permissionNames.forEach(name=>parsed[name]='Y');else try{parsed=JSON.parse(selected||'{}')}catch{}permissionNames.forEach(name=>{const wrap=document.createElement('label');wrap.className='perm';wrap.textContent=name;const check=document.createElement('input');check.type='checkbox';check.dataset.permission=name;check.checked=parsed[name]==='Y'||!selected;wrap.appendChild(check);box.appendChild(wrap);});}
    async function loadDropdowns(){const response=await fetch('/api/codes');const codes=await response.json();[['teamName','TEAM'],['jobRole','JOB']].forEach(([id,category])=>{const select=document.getElementById(id);const previous=select.value;select.innerHTML='';codes.filter(code=>code.category_code===category).forEach(code=>{const option=document.createElement('option');option.value=code.code_name;option.textContent=code.code_name;select.appendChild(option);});select.value=previous;});}
    async function loadUsers(){const response=await fetch('/api/users');const users=await response.json();const rows=document.getElementById('userRows');rows.innerHTML='';users.forEach(user=>{const row=document.createElement('tr');makeCell(row,user.id,user.is_admin?'admin':'');makeCell(row,user.name);makeCell(row,user.affiliation);makeCell(row,user.team_name);makeCell(row,user.job_role);makeCell(row,user.email);makeCell(row,[user.start_date,user.end_date].filter(Boolean).join(' ~ '));makeCell(row,permissionText(user.screen_permissions));const actions=makeCell(row,'');const edit=document.createElement('button');edit.textContent='수정';edit.addEventListener('click',()=>editUser(user));const reset=document.createElement('button');reset.textContent='비밀번호 초기화';reset.className='secondary';reset.style.marginLeft='4px';reset.addEventListener('click',()=>resetPassword(user.id));const remove=document.createElement('button');remove.textContent='삭제';remove.className='danger';remove.style.marginLeft='4px';remove.disabled=user.is_admin;remove.addEventListener('click',()=>deleteUser(user.id));actions.append(edit,reset,remove);rows.appendChild(row);});}
    function clearForm(){editingId='';document.getElementById('formTitle').textContent='신규 회원 등록';['userId','userName','affiliation','phone','email','startDate','endDate'].forEach(id=>document.getElementById(id).value='');document.getElementById('userId').disabled=false;renderPermissions('');}
    async function editUser(user){editingId=user.id;await loadDropdowns();document.getElementById('formTitle').textContent='회원 정보 수정';document.getElementById('userId').value=user.id;document.getElementById('userId').disabled=true;document.getElementById('userName').value=user.name||'';document.getElementById('affiliation').value=user.affiliation||'';document.getElementById('teamName').value=user.team_name||'';document.getElementById('jobRole').value=user.job_role||'';document.getElementById('phone').value=user.phone||'';document.getElementById('email').value=user.email||'';document.getElementById('startDate').value=user.start_date||'';document.getElementById('endDate').value=user.end_date||'';renderPermissions(user.screen_permissions);}
    async function saveUser(){const permissions={};document.querySelectorAll('[data-permission]').forEach(input=>permissions[input.dataset.permission]=input.checked?'Y':'N');const payload={id:document.getElementById('userId').value.trim(),name:document.getElementById('userName').value.trim(),affiliation:document.getElementById('affiliation').value,team_name:document.getElementById('teamName').value,job_role:document.getElementById('jobRole').value,phone:document.getElementById('phone').value,email:document.getElementById('email').value,start_date:document.getElementById('startDate').value,end_date:document.getElementById('endDate').value,screen_permissions:JSON.stringify(permissions)};if(payload.id.length<3||!payload.name){alert('아이디(3자 이상)와 성명을 입력해주세요.');return;}const response=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok){alert(result.message||'저장 실패');return;}if(result.temporary_password)alert(`임시 비밀번호: ${result.temporary_password}\n이 값은 지금 한 번만 표시됩니다.`);clearForm();loadUsers();}
    async function deleteUser(id){if(!confirm(`[${id}] 회원을 삭제하시겠습니까?`))return;const response=await fetch('/api/users',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});const result=await response.json();if(!response.ok)alert(result.message||'삭제 실패');else loadUsers();}
    async function resetPassword(id){const response=await fetch(`/api/users/${encodeURIComponent(id)}/reset-password`,{method:'POST'});const result=await response.json();alert(result.success?`임시 비밀번호: ${result.temporary_password}\n이 값은 지금 한 번만 표시됩니다.`:(result.message||'초기화 실패'));}
    async function importExcel(){const input=document.getElementById('excelFile');if(!input.files.length){alert('엑셀 파일을 선택해주세요.');return;}const body=new FormData();body.append('file',input.files[0]);const response=await fetch('/api/users/import',{method:'POST',body});const result=await response.json();alert(result.message);input.value='';}
    document.getElementById('newButton').addEventListener('click',clearForm);document.getElementById('cancelButton').addEventListener('click',clearForm);document.getElementById('saveButton').addEventListener('click',saveUser);document.getElementById('excelButton').addEventListener('click',importExcel);
    Promise.all([loadDropdowns(),loadUsers()]).then(clearForm);
</script>
</body>
</html>
