<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>KPetro WBS 로그인</title>
    <link rel="icon" href="/assets/kpetro-app-icon.png" type="image/png">
    <style>
        *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#121212;color:#e5e5e5;font-family:'Malgun Gothic',sans-serif}
        .card{width:min(390px,92vw);padding:30px;background:#1a1a1a;border:1px solid #343434;border-radius:12px;box-shadow:0 12px 35px rgba(0,0,0,.55)}
        .brand{display:block;width:210px;height:62px;object-fit:contain;margin:0 auto 18px}.notice{padding:10px 12px;margin-bottom:20px;border:1px solid #365472;border-radius:6px;background:#182432;color:#b9d5ef;font-size:12px;line-height:1.55}
        h1{text-align:center;font-size:21px;margin:0 0 22px}label{display:block;margin:13px 0 6px;color:#aaa;font-size:12px;font-weight:bold}input{width:100%;padding:11px;background:#272727;color:#fff;border:1px solid #555;border-radius:6px;font-size:14px}input:focus{outline:none;border-color:#5b9bd5}
        button,.link{width:100%;display:block;margin-top:16px;padding:11px;border-radius:6px;border:1px solid #5b9bd5;background:#2b4f73;color:#fff;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer}.link{margin-top:9px;background:#333;border-color:#555}.help{margin-top:16px;text-align:center;color:#8faecf;font-size:12px;cursor:pointer}.hidden{display:none}.change-title{margin-top:18px;padding-top:16px;border-top:1px solid #3a3a3a;color:#e4cd79;font-size:14px;font-weight:bold}
    </style>
</head>
<body>
    <main class="card">
        <img src="/assets/kpetro-ci.png" class="brand" alt="KPetro">
        <div class="notice">관리 화면은 승인된 계정만 사용할 수 있습니다. 대시보드는 로그인 없이 조회할 수 있습니다.</div>
        <h1>WBS 및 회의 관리 시스템</h1>
        <label for="loginId">아이디</label>
        <input id="loginId" autocomplete="username">
        <label for="loginPw">비밀번호</label>
        <input id="loginPw" type="password" autocomplete="current-password">
        <button type="button" id="loginButton">로그인</button>
        <section id="changeSection" class="hidden">
            <div class="change-title">최초 로그인 비밀번호 변경</div>
            <label for="newPassword">새 비밀번호</label>
            <input id="newPassword" type="password" autocomplete="new-password" placeholder="영문·숫자·특수문자 포함 10자 이상">
            <label for="confirmPassword">새 비밀번호 확인</label>
            <input id="confirmPassword" type="password" autocomplete="new-password">
            <button type="button" id="changeButton">비밀번호 변경 후 시작</button>
        </section>
        <div class="help" id="forgotButton">비밀번호 초기화 안내</div>
        <a class="link" href="/">공개 대시보드로 돌아가기</a>
    </main>
    <script>
        function moveNext(){
            const next=new URLSearchParams(location.search).get('next');
            location.href=next&&next.startsWith('/')&&!next.startsWith('//')?next:'/input.html';
        }
        async function login(){
            const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:document.getElementById('loginId').value.trim(),password:document.getElementById('loginPw').value})});
            const result=await response.json();
            if(response.ok&&result.success) {
                if(result.is_first_login) {
                    document.getElementById('changeSection').classList.remove('hidden');
                    document.getElementById('loginButton').disabled=true;
                    document.getElementById('newPassword').focus();
                    return;
                }
                moveNext();
            } else alert(result.message||'로그인하지 못했습니다.');
        }
        async function changePassword(){
            const password=document.getElementById('newPassword').value;
            const confirmPassword=document.getElementById('confirmPassword').value;
            if(password!==confirmPassword){alert('새 비밀번호 확인이 일치하지 않습니다.');return;}
            const response=await fetch('/api/first-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
            const result=await response.json();
            if(!response.ok){alert(result.message||'비밀번호를 변경하지 못했습니다.');return;}
            moveNext();
        }
        document.getElementById('loginButton').addEventListener('click',login);
        document.getElementById('loginPw').addEventListener('keydown',event=>{if(event.key==='Enter')login();});
        document.getElementById('changeButton').addEventListener('click',changePassword);
        document.getElementById('confirmPassword').addEventListener('keydown',event=>{if(event.key==='Enter')changePassword();});
        document.getElementById('forgotButton').addEventListener('click',()=>alert('시스템 관리자에게 임시 비밀번호 발급을 요청해주세요.'));
    </script>
</body>
</html>
