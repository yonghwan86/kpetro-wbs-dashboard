<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 설정</title>
    <meta name="robots" content="noindex,nofollow,noarchive">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/assets/kpetro-app-icon.png" type="image/png" sizes="512x512">
    <script src="/assets/secure-page.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 800px; margin: 20px auto; background: #1a1a1a; padding: 25px; border-radius: 10px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }

        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { font-size: 22px; color: #ffffff; }

        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; transition: background 0.2s; }
        .btn-success { background-color: #2e7d32; color: #fff; }
        .btn-success:hover { background-color: #388e3c; }
        .btn-secondary { background-color: #444; color: #fff; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-secondary:hover { background-color: #555; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; font-weight: bold; }

        input[type="text"], input[type="date"], input[type="file"] {
            width: 100%; background: #262626; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 4px; font-size: 13px;
        }
        input:focus { border-color: #5b9bd5; outline: none; }

        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }

        .preview-box { margin-top: 8px; display: flex; align-items: center; gap: 10px; font-size: 12px; }
        .preview-box img { height: 32px; width: 32px; object-fit: contain; border: 1px solid #444; background: #000; padding: 2px; border-radius: 4px; }
        .preview-box img.ci-preview { width: 240px; height: 72px; object-fit: contain; object-position: left center; background: #080808; padding: 5px; border-color: #333; border-radius: 6px; }
    </style>
    <link rel="stylesheet" href="/assets/management-shell.css">
</head>
<body>
    <div class="container">
        <header class="management-header">
            <div class="management-heading">
                <a class="management-dashboard-link" href="/" aria-label="대시보드로 돌아가기">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5.5 9.5V21h13V9.5"></path><path d="M9.5 21v-7h5v7"></path></svg>
                    대시보드
                </a>
                <h1 class="management-title">프로젝트 설정</h1>
                <p class="management-description">사업명·프로젝트 기간·D-DAY와 화면의 CI 이미지를 관리합니다.</p>
            </div>
            <div class="management-actions">
                <button class="btn btn-success" onclick="saveConfig()" title="프로젝트 설정 변경사항을 저장합니다.">설정 저장</button>
            </div>
        </header>

        <div class="form-group">
            <label>프로젝트 사업명</label>
            <input type="text" id="projectTitleInput" placeholder="예: 통합관제 프로젝트">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>프로젝트 시작일</label>
                <input type="date" id="startDateInput">
            </div>
            <div class="form-group">
                <label>프로젝트 종료일</label>
                <input type="date" id="endDateInput">
            </div>
        </div>

        <div class="form-group">
            <label>D-DAY 목표일</label>
            <input type="date" id="targetDateInput">
        </div>

        <div class="form-group">
                <label>회사 로고 이미지</label>
            <input type="file" id="logoInput" accept="image/*">
            <div class="preview-box">
                <span>현재 로고:</span>
                <img id="logoPreview" src="/api/branding/logo" alt="KPetro 코퍼레이트 심볼" class="ci-preview" onerror="this.src='/assets/kpetro-ci.png'">
            </div>
        </div>

        <div class="form-group">
                <label>파비콘 아이콘</label>
            <input type="file" id="faviconInput" accept=".ico, .png">
            <div class="preview-box">
                <span>현재 파비콘:</span>
                <img id="faviconPreview" src="/api/branding/favicon" alt="KPetro 앱 아이콘" onerror="this.src='/assets/kpetro-app-icon.png'">
            </div>
        </div>

    </div>

    <script>
        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                document.getElementById('projectTitleInput').value = config.project_title || '';
                document.getElementById('targetDateInput').value = config.target_date || '';
                document.getElementById('startDateInput').value = config.start_date || '';
                document.getElementById('endDateInput').value = config.end_date || '';
            } catch (e) {
                console.error("설정 로드 실패:", e);
            }
        }

        async function saveConfig() {
            const title = document.getElementById('projectTitleInput').value.trim();
            const sDate = document.getElementById('startDateInput').value;
            const eDate = document.getElementById('endDateInput').value;
            const tDate = document.getElementById('targetDateInput').value;
            const logoFile = document.getElementById('logoInput').files[0];
            const faviconFile = document.getElementById('faviconInput').files[0];

            if (!title || !sDate || !eDate || !tDate) {
                alert("모든 날짜와 사업명을 입력해 주세요.");
                return;
            }

            const formData = new FormData();
            formData.append('project_title', title);
            formData.append('start_date', sDate);
            formData.append('end_date', eDate);
            formData.append('target_date', tDate);
            if (logoFile) formData.append('logo', logoFile);
            if (faviconFile) formData.append('favicon', faviconFile);

            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();
                if (res.ok && result.success) {
                    alert("설정이 저장되었습니다.");
                    location.href = '/';
                } else {
                    alert("저장 실패");
                }
            } catch (e) {
                console.error(e);
                alert("통신 중 에러가 발생했습니다.");
            }
        }

        document.addEventListener("DOMContentLoaded", loadConfig);
    </script>
</body>
</html>
