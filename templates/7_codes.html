<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공통 코드 관리</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #1a1a1a; padding: 25px; border-radius: 10px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 22px; color: #ffffff; }

        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; transition: background 0.2s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .btn-primary { background-color: #2b4f73; color: #fff; border: 1px solid #5b9bd5; }
        .btn-primary:hover { background-color: #3b6fa5; }
        .btn-success { background-color: #2e7d32; color: #fff; }
        .btn-success:hover { background-color: #388e3c; }
        .btn-danger { background-color: #990000; color: #fff; }
        .btn-danger:hover { background-color: #cc0000; }
        .btn-home { background-color: #2b4f73; color: #fff; border: 1px solid #5b9bd5; }
        .btn-home:hover { background-color: #3b6fa5; }
        .btn-secondary { background-color: #444; color: #fff; }
        .btn-secondary:hover { background-color: #555; }

        .table-wrapper { max-height: 60vh; overflow-y: auto; border: 1px solid #444; border-radius: 6px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; }
        th, td { border: 1px solid #444; padding: 8px 10px; }
        th { background-color: #262626; color: #ddd; position: sticky; top: 0; z-index: 10; }
        td { background-color: #1a1a1a; }

        /* 모달 스타일 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: #1a1a1a; padding: 25px; border-radius: 10px; width: 450px; border: 1px solid #444; color: #fff; }
        .modal-box h3 { margin-bottom: 15px; font-size: 18px; color: #5b9bd5; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; font-weight: bold; }
        input, select { width: 100%; background: #262626; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 4px; font-size: 13px; }
        input:focus { border-color: #5b9bd5; outline: none; }
        .modal-btns { text-align: right; display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>공통 코드 관리</h1>
            <div style="display: flex; gap: 10px;">
                <a href="/users" class="btn btn-secondary">회원 관리로 이동</a>
                <a href="/" class="btn btn-home">🏠 대시보드로 가기</a>
            </div>
        </div>

        <div style="margin-bottom: 15px;">
            <button class="btn btn-primary" onclick="openCodeModal()">+ 신규 코드 등록</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>카테고리 코드</th>
                        <th>카테고리명</th>
                        <th>코드값</th>
                        <th>코드명</th>
                        <th>정렬순서</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="codeTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 코드 등록/수정 모달 -->
    <div id="codeModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">공통 코드 관리</h3>
            <input type="hidden" id="codeId">
            <div class="form-group">
                <label>카테고리 코드 (예: A01)</label>
                <input type="text" id="categoryCode" placeholder="예: A01">
            </div>
            <div class="form-group">
                <label>카테고리 코드명 (예: 팀명)</label>
                <input type="text" id="categoryCodeName" placeholder="예: 팀명">
            </div>
            <div class="form-group">
                <label>코드값 (예: 001)</label>
                <input type="text" id="codeValue" placeholder="예: 001">
            </div>
            <div class="form-group">
                <label>코드명 (예: 사업관리팀)</label>
                <input type="text" id="codeName" placeholder="예: 사업관리팀">
            </div>
            <div class="form-group">
                <label>정렬 순서 (숫자)</label>
                <input type="number" id="sortOrder" value="1">
            </div>
            <div class="modal-btns">
                <button class="btn btn-secondary" onclick="closeCodeModal()">취소</button>
                <button class="btn btn-success" onclick="saveCode()">저장하기</button>
            </div>
        </div>
    </div>

    <script>
        async function loadCodes() {
            try {
                const res = await fetch('/api/codes');
                if (res.status === 401 || res.status === 403) {
                    location.href = '/login';
                    return;
                }
                const codes = await res.json();
                const tbody = document.getElementById('codeTableBody');
                tbody.innerHTML = '';
                codes.forEach(c => {
                    const tr = document.createElement('tr');
                    [c.category_code, c.category_code_name, c.code_value, c.code_name, c.sort_order].forEach((value, index) => {
                        const td = document.createElement('td');
                        td.textContent = value ?? '';
                        if (index === 0) td.style.fontWeight = 'bold';
                        tr.appendChild(td);
                    });
                    const actions = document.createElement('td');
                    const editButton = document.createElement('button');
                    editButton.className = 'btn btn-primary';
                    editButton.style.cssText = 'padding:3px 8px; font-size:11px; margin-right:4px;';
                    editButton.textContent = '수정';
                    editButton.addEventListener('click', () => editCode(c.id, c.category_code, c.category_code_name, c.code_value, c.code_name, c.sort_order));
                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'btn btn-danger';
                    deleteButton.style.cssText = 'padding:3px 8px; font-size:11px;';
                    deleteButton.textContent = '삭제';
                    deleteButton.addEventListener('click', () => deleteCode(c.id));
                    actions.append(editButton, deleteButton);
                    tr.appendChild(actions);
                    tbody.appendChild(tr);
                });
            } catch(e) { console.error(e); }
        }

        function openCodeModal() {
            document.getElementById('codeId').value = '';
            document.getElementById('categoryCode').value = 'A01';
            document.getElementById('categoryCodeName').value = '팀명';
            document.getElementById('codeValue').value = '';
            document.getElementById('codeName').value = '';
            document.getElementById('sortOrder').value = '1';
            document.getElementById('codeModal').style.display = 'flex';
        }

        function editCode(id, catCode, catName, val, name, order) {
            document.getElementById('codeId').value = id;
            document.getElementById('categoryCode').value = catCode;
            document.getElementById('categoryCodeName').value = catName;
            document.getElementById('codeValue').value = val;
            document.getElementById('codeName').value = name;
            document.getElementById('sortOrder').value = order;
            document.getElementById('codeModal').style.display = 'flex';
        }

        function closeCodeModal() {
            document.getElementById('codeModal').style.display = 'none';
        }

        async function saveCode() {
            const payload = {
                id: document.getElementById('codeId').value || null,
                category_code: document.getElementById('categoryCode').value.trim(),
                category_code_name: document.getElementById('categoryCodeName').value.trim(),
                code_value: document.getElementById('codeValue').value.trim(),
                code_name: document.getElementById('codeName').value.trim(),
                sort_order: parseInt(document.getElementById('sortOrder').value) || 0
            };

            if(!payload.category_code || !payload.code_value || !payload.code_name) {
                alert("카테고리 코드, 코드값, 코드명은 필수 입력 항목입니다.");
                return;
            }

            try {
                const res = await fetch('/api/codes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if(res.ok && result.success) {
                    alert("저장되었습니다.");
                    closeCodeModal();
                    loadCodes();
                } else {
                    alert(result.message || "저장 실패");
                }
            } catch(e) { alert("통신 에러"); }
        }

        async function deleteCode(id) {
            if(!confirm("정말 이 코드를 삭제하시겠습니까?")) return;
            try {
                const res = await fetch('/api/codes', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const result = await res.json();
                if(res.ok && result.success) { loadCodes(); }
                else alert(result.message || '삭제하지 못했습니다.');
            } catch(e) { alert("삭제 에러"); }
        }

        document.addEventListener("DOMContentLoaded", loadCodes);
    </script>
</body>
</html>
