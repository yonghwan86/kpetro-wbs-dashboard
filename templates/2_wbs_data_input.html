<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBS 항목 및 일정 관리</title>
    <!-- 파비콘 설정 -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; }

        .container { max-width: 1400px; margin: 0 auto; background: #1a1a1a; padding: 25px; border-radius: 10px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }

        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 22px; color: #ffffff; }

        .btn-group { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; transition: background 0.2s; }
        .btn-primary { background-color: #2b4f73; color: #fff; border: 1px solid #5b9bd5; }
        .btn-primary:hover { background-color: #3b6fa5; }
        .btn-success { background-color: #2e7d32; color: #fff; }
        .btn-success:hover { background-color: #388e3c; }
        .btn-danger { background-color: #c62828; color: #fff; }
        .btn-danger:hover { background-color: #d32f2f; }
        .btn-secondary { background-color: #444; color: #fff; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-secondary:hover { background-color: #555; }

        .table-wrapper { max-height: 65vh; overflow-y: auto; border: 1px solid #444; border-radius: 6px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; }
        th, td { border: 1px solid #444; padding: 8px 10px; }
        th { background-color: #262626; color: #ddd; position: sticky; top: 0; z-index: 10; cursor: pointer; user-select: none; }
        th:hover { background-color: #333; }
        td { background-color: #1a1a1a; }

        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%; background: #262626; border: 1px solid #555; color: #fff; padding: 5px; border-radius: 4px; text-align: center; font-size: 13px;
        }
        input:focus { border-color: #5b9bd5; outline: none; }

        .sort-icon { font-size: 11px; margin-left: 5px; color: #8faecf; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h1>WBS 항목 및 일정 관리</h1>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="location.href='/'">대시보드로 가기</button>
                <button class="btn btn-primary" onclick="addRow()">+ 항목 추가</button>
                <button class="btn btn-success" onclick="saveAll()">전체 저장 및 반영</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="wbsTable">
                <thead>
                    <tr>
                        <th onclick="sortTable('system_name')">시스템명 <span id="sort-sys" class="sort-icon">▲▼</span></th>
                        <th onclick="sortTable('phase_name')">단계 <span id="sort-phase" class="sort-icon">▲▼</span></th>
                        <th>가중치(%)</th>
                        <th>계획진척율(%)</th>
                        <th>실제진척율(%)</th>
                        <th>계획시작일</th>
                        <th>계획종료일</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 데이터 동적 로드 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let wbsData = [];
        let currentSortField = '';
        let sortAsc = true;

        async function loadData() {
            try {
                const res = await fetch('/api/wbs');
                const state = await res.json();
                wbsData = [];
                for (const key in state) {
                    const [sys, phase] = key.split('_');
                    const item = state[key];
                    wbsData.push({
                        orig_sys: sys,
                        orig_phase: phase,
                        system_name: sys,
                        phase_name: phase,
                        weight: item.weight || 0,
                        plan: item.plan || 0,
                        actual: item.actual || 0,
                        start_date: item.start_date || '',
                        end_date: item.end_date || '',
                        date: item.date || new Date().toISOString().split('T')[0]
                    });
                }
                renderTable();
            } catch (e) {
                console.error("데이터 로드 실패:", e);
                alert("데이터를 불러오는 중 오류가 발생했습니다.");
            }
        }

        function escapeAttribute(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            wbsData.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="text" value="${escapeAttribute(row.system_name)}" id="sys_${index}"></td>
                    <td><input type="text" value="${escapeAttribute(row.phase_name)}" id="phase_${index}"></td>
                    <td><input type="number" step="0.1" value="${escapeAttribute(row.weight)}" id="weight_${index}"></td>
                    <td><input type="number" step="0.1" value="${escapeAttribute(row.plan)}" id="plan_${index}"></td>
                    <td><input type="number" step="0.1" value="${escapeAttribute(row.actual)}" id="actual_${index}"></td>
                    <td><input type="date" value="${escapeAttribute(row.start_date)}" id="start_${index}"></td>
                    <td><input type="date" value="${escapeAttribute(row.end_date)}" id="end_${index}"></td>
                    <td>
                        <div style="display: flex; gap: 5px; justify-content: center;">
                            <button class="btn btn-primary" style="padding: 4px 8px; font-size: 11px;" onclick="saveRow(${index})">개별저장</button>
                            <button class="btn btn-danger" style="padding: 4px 8px; font-size: 11px;" onclick="deleteRow(${index})">삭제</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function syncDataFromDOM() {
            wbsData.forEach((row, index) => {
                row.system_name = document.getElementById(`sys_${index}`).value.trim();
                row.phase_name = document.getElementById(`phase_${index}`).value.trim();
                row.weight = parseFloat(document.getElementById(`weight_${index}`).value) || 0;
                row.plan = parseFloat(document.getElementById(`plan_${index}`).value) || 0;
                row.actual = parseFloat(document.getElementById(`actual_${index}`).value) || 0;
                row.start_date = document.getElementById(`start_${index}`).value;
                row.end_date = document.getElementById(`end_${index}`).value;
            });
        }

        async function saveRow(index) {
            syncDataFromDOM();
            const row = wbsData[index];

            if (!row.system_name || !row.phase_name) {
                alert("시스템명과 단계명은 필수 입력입니다.");
                return;
            }

            const payload = [{
                original_system: row.orig_sys,
                original_phase: row.orig_phase,
                system_name: row.system_name,
                phase_name: row.phase_name,
                weight: row.weight,
                plan: row.plan,
                actual: row.actual,
                start_date: row.start_date,
                end_date: row.end_date,
                date: row.date
            }];

            try {
                const res = await fetch('/api/wbs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if (res.ok && result.success) {
                    alert(`[${row.system_name} - ${row.phase_name}] 항목이 저장되었습니다.`);
                    loadData(); // 최신 데이터 다시 로드
                } else {
                    alert("저장 실패: " + (result.error || '알 수 없는 오류'));
                }
            } catch (e) {
                console.error(e);
                alert("서버 통신 중 에러가 발생했습니다.");
            }
        }

        async function saveAll() {
            syncDataFromDOM();

            for (let row of wbsData) {
                if (!row.system_name || !row.phase_name) {
                    alert("모든 항목의 시스템명과 단계명은 필수 입력입니다.");
                    return;
                }
            }

            const payload = wbsData.map(row => ({
                original_system: row.orig_sys,
                original_phase: row.orig_phase,
                system_name: row.system_name,
                phase_name: row.phase_name,
                weight: row.weight,
                plan: row.plan,
                actual: row.actual,
                start_date: row.start_date,
                end_date: row.end_date,
                date: row.date
            }));

            try {
                const res = await fetch('/api/wbs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if (res.ok && result.success) {
                    alert("모든 WBS 항목이 성공적으로 저장 및 반영되었습니다.");
                    loadData();
                } else {
                    alert("전체 저장 실패: " + (result.error || '알 수 없는 오류'));
                }
            } catch (e) {
                console.error(e);
                alert("서버 통신 중 에러가 발생했습니다.");
            }
        }

        function addRow() {
            syncDataFromDOM();
            wbsData.push({
                orig_sys: '',
                orig_phase: '',
                system_name: '',
                phase_name: '',
                weight: 0,
                plan: 0,
                actual: 0,
                start_date: '',
                end_date: '',
                date: new Date().toISOString().split('T')[0]
            });
            renderTable();
        }

        async function deleteRow(index) {
            syncDataFromDOM();
            const row = wbsData[index];
            if (row.orig_sys && row.orig_phase) {
                if (!confirm(`[${row.orig_sys} - ${row.orig_phase}] 항목을 삭제하시겠습니까?`)) return;

                try {
                    const res = await fetch('/api/wbs', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ system_name: row.orig_sys, phase_name: row.orig_phase })
                    });
                    const result = await res.json();
                    if (!res.ok || !result.success) {
                        alert(result.message || '삭제하지 못했습니다.');
                        return;
                    }
                    wbsData.splice(index, 1);
                    renderTable();
                } catch(e) {
                    alert("삭제 중 에러가 발생했습니다.");
                }
            } else {
                wbsData.splice(index, 1);
                renderTable();
            }
        }

        function sortTable(field) {
            syncDataFromDOM();
            if (currentSortField === field) {
                sortAsc = !sortAsc;
            } else {
                currentSortField = field;
                sortAsc = true;
            }

            wbsData.sort((a, b) => {
                let valA = a[field].toString().toLowerCase();
                let valB = b[field].toString().toLowerCase();
                if (valA < valB) return sortAsc ? -1 : 1;
                if (valA > valB) return sortAsc ? 1 : -1;
                return 0;
            });

            renderTable();
        }

        document.addEventListener("DOMContentLoaded", loadData);
    </script>
</body>
</html>
