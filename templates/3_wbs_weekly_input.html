<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진척관리(주차별)</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1a1a1a; padding: 25px; border-radius: 10px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 22px; color: #ffffff; }

        .btn-group { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; transition: background 0.2s; }
        .btn-success { background-color: #2e7d32; color: #fff; }
        .btn-success:hover { background-color: #388e3c; }
        .btn-secondary { background-color: #444; color: #fff; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-secondary:hover { background-color: #555; }

        .table-wrapper { max-height: 65vh; overflow-y: auto; border: 1px solid #444; border-radius: 6px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; }
        th, td { border: 1px solid #444; padding: 8px 10px; }
        th { background-color: #262626; color: #ddd; position: sticky; top: 0; z-index: 10; }
        td { background-color: #1a1a1a; }
        input[type="number"] { width: 100%; background: #262626; border: 1px solid #555; color: #fff; padding: 5px; border-radius: 4px; text-align: center; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>진척관리(주차별)</h1>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="location.href='/'">대시보드로 가기</button>
                <button class="btn btn-success" onclick="saveAll()">전체 저장 및 반영</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 30%;">주차 (Week)</th>
                        <th style="width: 35%;">계획 진척율(%)</th>
                        <th style="width: 35%;">실제 진척율(%)</th>
                    </tr>
                </thead>
                <tbody id="weeklyTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let calculatedTotalWeeks = 0;

        async function loadWeeklyData() {
            try {
                // 1. 프로젝트 설정(시작일, 종료일) 불러오기
                const configRes = await fetch('/api/config');
                const config = await configRes.json();

                if (config.start_date && config.end_date) {
                    const start = new Date(config.start_date);
                    const end = new Date(config.end_date);
                    const totalDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
                    calculatedTotalWeeks = Math.max(1, Math.ceil(totalDays / 7));
                } else {
                    calculatedTotalWeeks = 21; // 기본값
                }

                // 2. 주차별 진척 데이터 불러오기
                const res = await fetch('/api/weekly');
                const data = await res.json();

                const tbody = document.getElementById('weeklyTableBody');
                tbody.innerHTML = '';

                // 3. 계산된 주차만큼 행 동적 생성
                for (let i = 1; i <= calculatedTotalWeeks; i++) {
                    let planVal = 0;
                    let actualVal = '';

                    if (data.plan && data.plan[i-1] !== undefined) {
                        planVal = data.plan[i-1];
                    }
                    if (data.actual && data.actual[i-1] !== undefined && data.actual[i-1] !== null) {
                        actualVal = data.actual[i-1];
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${i}주차</td>
                        <td><input type="number" step="0.01" value="${planVal}" id="plan_${i}"></td>
                        <td><input type="number" step="0.01" value="${actualVal}" id="actual_${i}" placeholder="0"></td>
                    `;
                    tbody.appendChild(tr);
                }
            } catch (e) {
                console.error("주차별 데이터 로드 실패:", e);
            }
        }

        async function saveAll() {
            const payload = [];

            for (let i = 1; i <= calculatedTotalWeeks; i++) {
                const planInput = document.getElementById(`plan_${i}`);
                const actualInput = document.getElementById(`actual_${i}`);

                const planVal = planInput ? planInput.value : 0;
                const actualVal = actualInput ? actualInput.value : '';

                payload.push({
                    week_no: i,
                    plan_rate: planVal !== "" ? parseFloat(planVal) : 0,
                    actual_rate: actualVal !== "" ? parseFloat(actualVal) : null
                });
            }

            try {
                const res = await fetch('/api/weekly', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if (res.ok) {
                    alert("주차별 진척율이 성공적으로 저장되었습니다.");
                    loadWeeklyData();
                } else {
                    alert("저장 실패: " + result.message);
                }
            } catch (e) {
                console.error(e);
                alert("서버와 통신 중 에러가 발생했습니다.");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadWeeklyData();
        });
    </script>
</body>
</html>
