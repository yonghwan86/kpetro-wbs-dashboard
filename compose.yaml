services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wbs_db}
      MARIADB_USER: ${DB_USER:-wbs_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-this-password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-this-root-password}
    ports:
      - "${DB_EXPOSE_PORT:-3303}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-wbs_db}
      DB_USER: ${DB_USER:-wbs_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-this-password}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_LIFETIME_MINUTES: ${SESSION_LIFETIME_MINUTES:-480}
      PUBLIC_DASHBOARD: ${PUBLIC_DASHBOARD:-true}
      INITIAL_ADMIN_ID: ${INITIAL_ADMIN_ID:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-replace-with-a-strong-initial-password}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.invalid}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      FLASK_DEBUG: "false"
      UPLOAD_FOLDER: uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      ALLOWED_UPLOAD_EXTENSIONS: ${ALLOWED_UPLOAD_EXTENSIONS:-pdf,doc,docx,hwp,hwpx,xls,xlsx,ppt,pptx,txt,png,jpg,jpeg}
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
