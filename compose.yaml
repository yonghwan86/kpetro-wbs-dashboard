services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wbs_db}
      MARIADB_USER: ${DB_USER:-wbs_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-this-password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-this-root-password}
    ports:
      - "${DB_EXPOSE_PORT:-3303}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-wbs_db}
      DB_USER: ${DB_USER:-wbs_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-this-password}
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      FLASK_DEBUG: "false"
      UPLOAD_FOLDER: uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
